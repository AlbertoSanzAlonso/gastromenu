name = "gastromenu-content"
main = "workers/content/index.ts"
compatibility_date = "2026-10-17"

# D1/R2 desactivados hasta activar R2 en el dashboard y crear recursos:
#   npm run cf:create
# [[d1_databases]]
# binding = "DB"
# database_name = "gastromenu"
# database_id = "00000000-0000-0000-0000-000000000000"
# migrations_dir = "migrations"
#
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "gastromenu-media"

# Formulario vía Resend.
# Local: `.dev.vars` · Producción: npx wrangler secret put RESEND_API_KEY
[vars]
CONTACT_TO = "hola@gastromenupremium.com"
CONTACT_FROM = "hola@gastromenupremium.com"
CONTACT_FROM_NAME = "GastroMenu Premium"
